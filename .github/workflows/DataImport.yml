name: import-data-to-target

on:
  workflow_dispatch:
    inputs:
      data_file:
        description: "Path to your data package zip in the repo"
        required: true
        default: "Data/data.zip"
      connection_count:
        description: "Parallel import connections"
        required: false
        default: "5"

env:
  TARGET_ENVIRONMENT_URL: "https://org36dcad8d.crm9.dynamics.com"
  CLIENT_ID: "2b90092e-67c7-4f5b-ab0d-806e63d26e10"
  TENANT_ID: "5a3479ae-949c-40ec-b00d-7d82a1729e23"

permissions:
  contents: read

jobs:
  import-data:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: WhoAmI
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ env.TARGET_ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.PowerPlatformSPN }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Import data package
        uses: microsoft/powerplatform-actions/import-data@v1
        with:
          environment-url: ${{ env.TARGET_ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.PowerPlatformSPN }}
          tenant-id: ${{ env.TENANT_ID }}
          data-file: ${{ github.event.inputs.data_file }}
          connection-count: ${{ github.event.inputs.connection_count }}
